name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run alembic upgrade head --sql > migration.sql
      - run: python -m json.tool observability/grafana-dashboard.json > /dev/null
      - name: Validate Prometheus rules
        run: >-
          docker run --rm
          --volume "$PWD/observability:/work:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v3.14.0
          check rules /work/prometheus-alerts.yml

  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/ragdb
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-secret
      RUN_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -q tests/live
