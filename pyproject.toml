[project]
name = "fastapi-huggingface-rag"
version = "0.1.0"
description = "Multi-user RAG API with FastAPI, pgvector, Redis, and Hugging Face"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "arq>=0.28,<0.29",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "bcrypt>=4.0.1,<4.1",
  "email-validator>=2.2,<3",
  "fastapi>=0.141,<0.142",
  "huggingface-hub>=1.3,<2",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.23,<1",
  "pypdf>=6,<7",
  "pydantic-settings>=2.10,<3",
  "passlib[bcrypt]>=1.7.4,<2",
  "python-jose[cryptography]>=3.5,<4",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<6",
  "sentry-sdk[fastapi]>=2,<3",
  "sqlmodel>=0.0.30,<0.1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: requires live PostgreSQL/pgvector and Redis services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
