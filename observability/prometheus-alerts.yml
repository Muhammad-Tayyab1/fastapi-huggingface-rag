groups:
  - name: fastapi-huggingface-rag
    interval: 30s
    rules:
      - record: rag_api:http_request_rate5m
        expr: sum(rate(rag_api_http_requests_total[5m]))
      - record: rag_api:http_error_ratio5m
        expr: sum(rate(rag_api_http_requests_total{status=~"5.."}[5m])) / clamp_min(rag_api:http_request_rate5m, 0.001)
      - record: rag_api:http_p95_latency_seconds5m
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_api_http_request_duration_seconds_bucket[5m])))

      - alert: RagApiTargetDown
        expr: up{job="fastapi-huggingface-rag"} == 0
        for: 2m
        labels:
          severity: critical
          service: fastapi-huggingface-rag
        annotations:
          summary: RAG API metrics target is down
          description: Prometheus has failed to scrape the RAG API for more than two minutes.

      - alert: RagApiHighErrorRate
        expr: rag_api:http_error_ratio5m > 0.05 and rag_api:http_request_rate5m > 0.1
        for: 10m
        labels:
          severity: critical
          service: fastapi-huggingface-rag
        annotations:
          summary: RAG API 5xx error ratio is above 5%
          description: The five-minute 5xx ratio has exceeded 5% for ten minutes.

      - alert: RagApiHighLatency
        expr: rag_api:http_p95_latency_seconds5m > 2
        for: 10m
        labels:
          severity: warning
          service: fastapi-huggingface-rag
        annotations:
          summary: RAG API p95 latency is above two seconds
          description: Overall HTTP p95 latency has exceeded two seconds for ten minutes.

      - alert: RagApiProviderErrors
        expr: sum by (operation) (rate(rag_api_provider_requests_total{outcome="error"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          service: fastapi-huggingface-rag
        annotations:
          summary: Hugging Face provider errors are elevated
          description: Provider operation {{ $labels.operation }} is failing above 0.1 attempts per second.

      - alert: RagApiIngestionFailures
        expr: sum(rate(rag_api_ingestion_jobs_total{outcome="failed"}[15m])) / clamp_min(sum(rate(rag_api_ingestion_jobs_total[15m])), 0.001) > 0.1 and sum(rate(rag_api_ingestion_jobs_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: fastapi-huggingface-rag
        annotations:
          summary: Document ingestion failure ratio is above 10%
          description: More than 10% of ingestion jobs have failed over the last fifteen minutes.

      - alert: RagApiQueueBacklog
        expr: rag_api_arq_queue_depth > 100
        for: 15m
        labels:
          severity: warning
          service: fastapi-huggingface-rag
        annotations:
          summary: ARQ ingestion queue has a sustained backlog
          description: More than 100 jobs have remained queued for fifteen minutes.

      - alert: RagApiHighNoContextRatio
        expr: sum(rate(rag_api_queries_total{outcome="no_context"}[15m])) / clamp_min(sum(rate(rag_api_queries_total[15m])), 0.001) > 0.5 and sum(rate(rag_api_queries_total[15m])) > 0.01
        for: 30m
        labels:
          severity: info
          service: fastapi-huggingface-rag
        annotations:
          summary: More than half of RAG queries return no context
          description: Investigate document readiness, retrieval thresholds, or a change in query traffic.
