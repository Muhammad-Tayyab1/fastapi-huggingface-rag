global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: fastapi-huggingface-rag
    metrics_path: /metrics
    bearer_token_file: /run/secrets/rag_metrics_token
    static_configs:
      - targets:
          - fastapi-huggingface-rag-api:8000
